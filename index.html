<!DOCTYPE html> <html lang="fr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <meta name="theme-color" content="#020403"> <title>JOKER FOLDER 2 | MATRIX</title> <style> :root { --bg: #020403; --panel: #07110b; --green: #00ff66; --green-dark: #008f3b; --text: #d8ffe4; --muted: #86a994; --border: rgba(0,255,102,.28); } * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: Arial, sans-serif; overflow-x: hidden; } #matrix { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: .22; pointer-events: none; } /* ÉCRAN DE DÉMARRAGE */ .loader { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px; background: #020403; transition: opacity .7s ease, visibility .7s ease; animation: autoHide 4s forwards; } .loader-logo { color: var(--green); font-size: clamp(25px, 7vw, 42px); font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 20px var(--green); text-align: center; } .loader-sub { color: var(--muted); font-size: 11px; letter-spacing: 4px; text-align: center; } .loader-bar { width: 210px; height: 3px; background: #14231a; overflow: hidden; border-radius: 10px; } .loader-progress { width: 0; height: 100%; background: var(--green); box-shadow: 0 0 12px var(--green); animation: progress 2.5s ease forwards; } .boot-text { color: var(--green); font-size: 12px; letter-spacing: 2px; } @keyframes progress { to { width: 100%; } } @keyframes autoHide { 0%, 70% { opacity: 1; visibility: visible; } 100% { opacity: 0; visibility: hidden; pointer-events: none; } } .loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; } .page { position: relative; z-index: 1; width: 100%; max-width: 540px; margin: auto; padding: 24px 16px 40px; } .top-status { display: flex; justify-content: center; align-items: center; gap: 8px; color: var(--green); font-size: 10px; letter-spacing: 2px; margin-bottom: 22px; } .online-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); } header { text-align: center; margin-bottom: 25px; } .logo { display: inline-flex; align-items: center; justify-content: center; width: 75px; height: 75px; border: 1px solid var(--green); color: var(--green); font-size: 28px; font-weight: 900; box-shadow: 0 0 24px rgba(0,255,102,.12); transform: rotate(45deg); margin: 5px 0 22px; } .logo span { transform: rotate(-45deg); } h1 { color: var(--green); font-size: clamp(24px, 6vw, 34px); letter-spacing: 2px; margin: 0 0 10px; overflow-wrap: anywhere; text-shadow: 0 0 16px rgba(0,255,102,.3); } .subtitle { color: var(--muted); font-size: 12px; line-height: 1.7; letter-spacing: 1px; } .panel { background: rgba(7,17,11,.95); border: 1px solid var(--border); border-radius: 12px; padding: 22px 18px; box-shadow: 0 0 35px rgba(0,255,102,.05); } .panel-title { color: var(--green); font-size: 13px; letter-spacing: 2px; border-bottom: 1px solid var(--border); padding-bottom: 14px; margin: 0 0 20px; } .field { margin-bottom: 17px; } label { display: block; margin-bottom: 8px; font-size: 11px; letter-spacing: 1px; color: #a8d9b8; } input, select { width: 100%; min-height: 46px; background: #020704; border: 1px solid #21452e; border-radius: 6px; color: #e5ffed; padding: 12px; font-size: 14px; outline: none; } input:focus, select:focus { border-color: var(--green); box-shadow: 0 0 10px rgba(0,255,102,.1); } select option { background: #07110b; color: white; } .consent { display: flex; align-items: flex-start; gap: 10px; font-size: 12px; line-height: 1.6; color: var(--muted); margin: 18px 0; } .consent input { width: 17px; min-height: 17px; margin-top: 2px; accent-color: var(--green); flex-shrink: 0; } .submit-btn { width: 100%; min-height: 48px; border: 1px solid var(--green); border-radius: 6px; background: var(--green); color: #001707; font-size: 12px; font-weight: 900; letter-spacing: 2px; cursor: pointer; transition: .2s; } .submit-btn:hover { box-shadow: 0 0 20px rgba(0,255,102,.25); } .submit-btn:disabled { opacity: .55; cursor: wait; } .message { display: none; padding: 12px; margin-top: 16px; border-radius: 6px; font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; } .message.success { display: block; border: 1px solid var(--green); color: var(--green); background: rgba(0,255,102,.06); } .message.error { display: block; border: 1px solid #ff4b4b; color: #ff8585; background: rgba(255,0,0,.06); } .security-note { text-align: center; color: #668473; font-size: 10px; line-height: 1.8; margin-top: 18px; } footer { text-align: center; color: #587462; font-size: 10px; letter-spacing: 1px; margin-top: 25px; } @media (max-width: 360px) { .panel { padding: 18px 13px; } h1 { letter-spacing: 1px; } } </style> </head> <body> <canvas id="matrix"></canvas> <!-- ÉCRAN DE DÉMARRAGE --> <div class="loader" id="loader"> <div class="loader-logo">JOKER FOLDER</div> <div class="loader-sub">MATRIX SYSTEM V2</div> <div class="loader-bar"> <div class="loader-progress"></div> </div> <div class="boot-text">INITIALISATION DU SYSTÈME...</div> </div> <!-- Ce script fonctionne indépendamment du script principal --> <script> (() => { const loader = document.getElementById("loader"); if (loader) { setTimeout(() => { loader.classList.add("hidden"); setTimeout(() => { if (loader.parentNode) loader.remove(); }, 900); }, 3000); } })(); </script> <main class="page"> <div class="top-status"> <span class="online-dot"></span> MATRIX SYSTEM — ONLINE </div> <header> <div class="logo"><span>JF</span></div> <h1>JOKER FOLDER 2</h1> <div class="subtitle"> ACCÈS AU SYSTÈME MATRIX<br> FORMULAIRE D'INSCRIPTION </div> </header> <section class="panel"> <h2 class="panel-title">▸ CRÉER VOTRE INSCRIPTION</h2> <form id="registrationForm"> <div class="field"> <label for="nom">NOM</label> <input id="nom" name="nom" type="text" placeholder="Votre nom" autocomplete="family-name" required > </div> <div class="field"> <label for="prenom">PRÉNOM</label> <input id="prenom" name="prenom" type="text" placeholder="Votre prénom" autocomplete="given-name" required > </div> <div class="field"> <label for="telephone">NUMÉRO DE TÉLÉPHONE</label> <input id="telephone" name="telephone" type="tel" placeholder="+509..." autocomplete="tel" required > </div> <div class="field"> <label for="sexe">SEXE</label> <select id="sexe" name="sexe" required> <option value="">Sélectionnez une option</option> <option value="Masculin">Masculin</option> <option value="Féminin">Féminin</option> <option value="Autre">Autre</option> <option value="Non précisé">Je préfère ne pas préciser</option> </select> </div> <label class="consent"> <input id="consentement" type="checkbox" required> <span> J'accepte que les informations saisies soient utilisées pour traiter mon inscription. </span> </label> <button class="submit-btn" id="submitBtn" type="submit"> ENVOYER MON INSCRIPTION </button> <div id="message" class="message" role="status" aria-live="polite"></div> </form> </section> <div class="security-note"> SYSTEM STATUS: MATRIX ACTIVE<br> Vérifiez vos informations avant l'envoi. </div> <footer> © 2026 JOKER FOLDER 2 | MATRIX </footer> </main> <!-- Animation Matrix --> <script> (() => { const canvas = document.getElementById("matrix"); const ctx = canvas.getContext("2d"); if (!ctx) return; const chars = "01アイウエオカキクケコABCDEFGHIJKLMNOPQRSTUVWXYZ"; const fontSize = 14; let drops = []; let columns = 0; let animationId; function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; columns = Math.ceil(canvas.width / fontSize); drops = Array(columns).fill(1); } function drawMatrix() { ctx.fillStyle = "rgba(2,4,3,0.08)"; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "#00ff66"; ctx.font = fontSize + "px monospace"; for (let i = 0; i < drops.length; i++) { const char = chars[Math.floor(Math.random() * chars.length)]; ctx.fillText(char, i * fontSize, drops[i] * fontSize); if ( drops[i] * fontSize > canvas.height && Math.random() > 0.975 ) { drops[i] = 0; } drops[i]++; } animationId = requestAnimationFrame(drawMatrix); } window.addEventListener("resize", resizeCanvas); resizeCanvas(); drawMatrix(); })(); </script> <!-- EmailJS : configuration à compléter --> <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script> <script> (() => { const form = document.getElementById("registrationForm"); const button = document.getElementById("submitBtn"); const message = document.getElementById("message"); /* REMPLACE ces 3 valeurs par celles de TON compte EmailJS. N'utilise pas une clé secrète privée dans le HTML. */ const EMAILJS_PUBLIC_KEY = "RLwJmhWCloCH-sV6E";
const EMAILJS_SERVICE_ID = "service_7h423kp";
const EMAILJS_TEMPLATE_ID = "template_0mxv0vz"; function showMessage(text, type) { message.textContent = text; message.className = "message " + type; } form.addEventListener("submit", async (event) => { event.preventDefault(); if (!form.reportValidity()) return; if ( !window.emailjs || EMAILJS_PUBLIC_KEY === "TON_PUBLIC_KEY" || EMAILJS_SERVICE_ID === "TON_SERVICE_ID" || EMAILJS_TEMPLATE_ID === "TON_TEMPLATE_ID" ) { showMessage( "Le formulaire est prêt, mais EmailJS n'est pas encore configuré. Ajoutez votre Public Key, Service ID et Template ID dans le code.", "error" ); return; } button.disabled = true; button.textContent = "ENVOI EN COURS..."; const templateParams = { nom: document.getElementById("nom").value.trim(), prenom: document.getElementById("prenom").value.trim(), telephone: document.getElementById("telephone").value.trim(), sexe: document.getElementById("sexe").value, consentement: "Accepté", time: new Date().toLocaleString("fr-FR") }; try { await emailjs.send( EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams, { publicKey: EMAILJS_PUBLIC_KEY } ); showMessage( "Inscription envoyée avec succès !", "success" ); form.reset(); } catch (error) { console.error("EmailJS error:", error); showMessage( "Échec de l'envoi. Vérifiez la configuration EmailJS et la connexion Internet, puis réessayez.", "error" ); } finally { button.disabled = false; button.textContent = "ENVOYER MON INSCRIPTION"; } }); })(); </script> </body> </html> ￼Enter
